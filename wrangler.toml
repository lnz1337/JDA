# Worker único: serve a API (Hono) e os assets estáticos do PWA.
# A pasta de assets NÃO é declarada aqui: quem define é o @cloudflare/vite-plugin,
# usando a saída do build do client.

name = "jda-pwa"
main = "./src/worker/index.ts"
compatibility_date = "2026-10-12"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Lembrete de oração (§11). A cada 5 minutos, não de hora em hora: o horário
# padrão é 7h e quase todo mundo fica nele, então uma execução por hora
# concentraria a base inteira numa só — e execução de Worker tem limite de tempo
# e de subrequisições. Em lotes de 5 em 5 minutos, quem está na hora certa
# continua recebendo dentro da hora que escolheu.
[triggers]
crons = ["*/5 * * * *"]

[assets]
# SPA: qualquer rota desconhecida devolve o index.html do PWA.
not_found_handling = "single-page-application"
# API e mídia passam pelo Worker antes de qualquer asset.
run_worker_first = ["/api/*", "/media/*", "/parar", "/acesso"]

# ---------------------------------------------------------------- development
[vars]
ENV = "development"
APP_URL = "http://localhost:5173"
MAIL_PROVIDER = "cloudflare"
MAIL_FROM = "contato@mail.jornadacomeuanjo.com"
MAIL_FROM_NAME = "Jornada com Meu Anjo"
SUPPORT_EMAIL = "suporte@jornadacomeuanjo.com"

# Sem destination_address: o app manda para o e-mail do cliente, não para uma
# caixa verificada. O remetente é checado pelo domínio habilitado no Email Sending.
[[send_email]]
name = "EMAIL"

[[d1_databases]]
binding = "DB"
database_name = "jda-pwa-dev"
database_id = "local-dev-placeholder" # local: o id não é usado
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "jda-pwa-media-dev"

# -------------------------------------------------------------------- staging
[env.staging]
name = "jda-pwa-staging"
# O workers.dev continua de pé enquanto o subdomínio novo não é o único caminho.
workers_dev = true

# Subdomínio próprio: link de e-mail apontando para workers.dev é sinal ruim de
# entrega (domínio diferente do remetente, e muito usado em golpe).
[[env.staging.routes]]
pattern = "teste.jornadacomeuanjo.com"
custom_domain = true

[env.staging.vars]
# ENV=development em staging para que postbacks com test=true sejam processados
# (ver CLAUDE.md §7, passo 2).
ENV = "development"
APP_URL = "https://teste.jornadacomeuanjo.com"
MAIL_PROVIDER = "cloudflare"
MAIL_FROM = "contato@mail.jornadacomeuanjo.com"
MAIL_FROM_NAME = "Jornada com Meu Anjo"
SUPPORT_EMAIL = "suporte@jornadacomeuanjo.com"

[[env.staging.send_email]]
name = "EMAIL"

[env.staging.observability]
enabled = true

# Environment do wrangler NÃO herda os triggers do bloco de cima: sem repetir
# aqui, o cron simplesmente não existiria em staging.
[env.staging.triggers]
crons = ["*/5 * * * *"]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "jda-pwa-staging"
database_id = "53e3ee12-94d7-4c03-b2c8-06758d153b34"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "jda-pwa-media-staging"

# ----------------------------------------------------------------- production
[env.production]
name = "jda-pwa"
# Produção atende pelo domínio e só por ele.
workers_dev = false

[[env.production.routes]]
pattern = "jornadacomeuanjo.com"
custom_domain = true

# O `www` existia como CNAME para a raiz e parou de responder quando a raiz virou
# Custom Domain do Worker (o Worker não atende por um host que não é dele: dava
# 522). Serve o mesmo app. Para canonizar `www` → raiz seria preciso uma Redirect
# Rule no painel: asset estático não passa pelo Worker, então redirecionar por
# código aqui não alcançaria a tela inicial.
[[env.production.routes]]
pattern = "www.jornadacomeuanjo.com"
custom_domain = true

[env.production.vars]
ENV = "production"
APP_URL = "https://jornadacomeuanjo.com"
MAIL_PROVIDER = "cloudflare"
MAIL_FROM = "contato@mail.jornadacomeuanjo.com"
MAIL_FROM_NAME = "Jornada com Meu Anjo"
SUPPORT_EMAIL = "suporte@jornadacomeuanjo.com"

[[env.production.send_email]]
name = "EMAIL"

[env.production.observability]
enabled = true

[env.production.triggers]
crons = ["*/5 * * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "jda-pwa-prod"
database_id = "eddb43c3-75ea-43f3-a8cf-4371a833b573"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "jda-pwa-media"
